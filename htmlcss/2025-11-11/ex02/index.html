<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Title</title>

  <style>

    a {
      color: black;
      text-decoration: none;
    }

    li {
      list-style: none;
      /*list-style-type: katakana;*/
    }
    ul li:nth-child(1), li:nth-of-type(4) {
        background-color: red;
    }

    ul li:last-of-type {
        background-color: blue;
    }
  </style>
</head>
<body>

<ul>
  <li><a href="#">Home</a></li>
  <li><a href="#">Products</a></li>
  <li><a href="#">About us</a></li>
  <div></div>
  <li><a href="#">Jobs</a></li>
  <li><a href="#">Jobs</a></li>
</ul>

</body>
</html>
