services:
  api:
    container_name: 'f8-k18-express'
    image: node:24.0.0-alpine
    working_dir: /app/api
    ports:
      - '3000:3000'
    volumes:
      - './:/app/api'
    command: ['npm', 'run', 'dev']

  db:
    container_name: 'f8-k18-database'
    image: postgres:17
    ports:
      - '3100:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    volumes:
      - './db:/var/lib/postgresql/data'